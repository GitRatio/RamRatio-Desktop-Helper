name: Build and release Desktop Helper
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested unsigned preview packages
        type: boolean
        default: false
concurrency:
  group: desktop-helper-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runtime: win-x64, runner: windows-latest, test: true}
          - {runtime: win-arm64, runner: windows-latest, test: false}
          - {runtime: osx-x64, runner: macos-15-intel, test: true}
          - {runtime: osx-arm64, runner: macos-15, test: true}
          - {runtime: linux-x64, runner: ubuntu-24.04, test: true}
          - {runtime: linux-arm64, runner: ubuntu-24.04-arm, test: true}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - shell: pwsh
        run: ./tools/package.ps1 -Runtime ${{ matrix.runtime }}
      - name: Test isolated installer failure and rollback paths
        shell: pwsh
        run: dotnet run --project tests/InstallSafetyHarness.csproj --configuration Release
      - if: matrix.test
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          node tools/test-helper.mjs "artifacts/${{ matrix.runtime }}/RamRatio.DesktopHelper.Setup$suffix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: matrix.test
        shell: pwsh
        env:
          RAMRATIO_INSTALL_TEST: '1'
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          node tools/test-installer.mjs "artifacts/${{ matrix.runtime }}/RamRatio.DesktopHelper.Setup$suffix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: startsWith(matrix.runtime, 'win-')
        name: Verify single-file Windows installer output
        shell: pwsh
        run: |
          $installer = "artifacts/RamRatio-DesktopHelper-Setup-${{ matrix.runtime }}.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "Missing standalone Windows installer: $installer" }
          if ((Get-Item -LiteralPath $installer).Length -lt 100000) { throw "Installer unexpectedly small" }
      - if: matrix.runtime == 'win-x64'
        name: Verify bundled native host without installing
        shell: pwsh
        run: |
          node tools/test-windows-installer.mjs "artifacts/RamRatio-DesktopHelper-Setup-win-x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: startsWith(matrix.runtime, 'osx-')
        name: Verify macOS setup app and DMG
        shell: pwsh
        run: |
          $app = "artifacts/RamRatio-DesktopHelper-Setup-${{ matrix.runtime }}.app"
          $appZip = "artifacts/RamRatio-DesktopHelper-Setup-${{ matrix.runtime }}.app.zip"
          if (!(Test-Path -LiteralPath $appZip)) { throw "Missing macOS app ZIP" }
          & unzip -tq $appZip
          if ($LASTEXITCODE -ne 0) { throw 'App ZIP integrity failed' }
          $dmg = "artifacts/RamRatio-DesktopHelper-Setup-${{ matrix.runtime }}.dmg"
          & plutil -lint (Join-Path $app "Contents/Info.plist")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & sh -n (Join-Path $app "Contents/MacOS/RamRatioSetup")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath $dmg) {
            & hdiutil verify $dmg
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - if: startsWith(matrix.runtime, 'linux-')
        name: Verify Linux one-file installer and integrity protection
        shell: pwsh
        run: |
          $runFile = "artifacts/RamRatio-DesktopHelper-Setup-${{ matrix.runtime }}.run"
          if (!(Test-Path -LiteralPath $runFile)) { throw "Missing self-extracting Linux setup" }
          & sh $runFile --verify-payload
          if ($LASTEXITCODE -ne 0) { throw 'Linux package integrity failed' }
          & sh $runFile --version
          if ($LASTEXITCODE -ne 0) { throw 'Linux bundled executable failed to start' }
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/RamRatio-DesktopHelper-Setup-win-*.exe
            artifacts/RamRatio-DesktopHelper-Setup-osx-*.dmg
            artifacts/RamRatio-DesktopHelper-Setup-linux-*.run
            artifacts/*.tar.gz
            artifacts/SHA256SUMS-*.txt
  release:
    # A reviewed [publish-preview] squash-merge can publish once after every
    # matrix job succeeds; ordinary pushes do not produce automatic releases.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-preview]'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish preview with matching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="helper-0.3.0-preview.${{ github.run_number }}"
          git archive --format=zip --output=release-assets/RamRatio-DesktopHelper-source.zip HEAD
          sha256sum release-assets/RamRatio-DesktopHelper-source.zip > release-assets/SHA256SUMS-source.txt
          gh release create "$tag" release-assets/* --target "${{ github.sha }}" --title "Desktop Helper 0.3.0 preview" --notes-file RELEASE-NOTES.md --prerelease